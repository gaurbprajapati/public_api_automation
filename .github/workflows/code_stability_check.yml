on:
  pull_request:
    branches:
      - test_stability_pipeline
    types: [closed]
  pull_request_target:
    types: [closed]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Job
        run: |
          curl -X POST -u ${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }} "https://jenkins-qa.recruitcrm.net/job/Code%20Stability%20Check/buildWithParameters?REPO_URL=https://github.com/Workforce-Cloud-Tech/testtherest_framework.git&REPO_BRANCH=test_stability_pipeline"
